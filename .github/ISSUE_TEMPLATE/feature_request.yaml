name: Feature Request
description: Suggest a new feature or enhancement for containerd
title: "[FEATURE]: "
labels: ["kind/feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature! Please fill out the form below.
        Before submitting, please search existing issues to avoid duplicates.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the [contributing guidelines](https://github.com/containerd/containerd/blob/main/CONTRIBUTING.md).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Provide a clear and concise description.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
      placeholder: "I would like containerd to support..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "An alternative approach could be..."
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which component does this feature request affect?
      multiple: true
      options:
        - snapshotter
        - content store
        - image service
        - container service
        - task service
        - CRI plugin
        - runtime (shim)
        - client library
        - CLI (ctr)
        - metadata
        - garbage collection
        - networking
        - other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Describe the use case or scenario that motivates this feature request.
      placeholder: "This feature would help when deploying..."
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature request here.
    validations:
      required: false
